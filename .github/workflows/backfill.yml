name: Backfill Comments

on:
  workflow_dispatch:
    inputs:
      docket_id:
        description: 'Specific docket ID to backfill (leave empty for all with gaps)'
        required: false
      max_comments:
        description: 'Max comments to fetch per docket (default 10000)'
        required: false
        default: '10000'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync

      - name: Backfill comments
        env:
          REGULATIONS_API_KEY: ${{ secrets.REGULATIONS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          if [ -n "${{ github.event.inputs.docket_id }}" ]; then
            uv run python -m src.jobs.sync \
              --docket-id "${{ github.event.inputs.docket_id }}" \
              --max-comments "${{ github.event.inputs.max_comments || '10000' }}"
          else
            uv run python -m src.jobs.sync \
              --backfill \
              --max-comments "${{ github.event.inputs.max_comments || '10000' }}"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Backfill Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
