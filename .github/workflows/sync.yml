name: Daily Sync

on:
  schedule:
    - cron: '0 7 * * *'  # Daily at 7am UTC

  workflow_dispatch:
    inputs:
      mode:
        description: 'Sync mode'
        required: false
        type: choice
        default: 'sync'
        options:
          - sync
          - backfill
      docket_id:
        description: 'Specific docket ID to sync (leave empty for all active)'
        required: false
      max_comments:
        description: 'Max new comments per docket (default 500, backfill uses 10000)'
        required: false
        default: '500'

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install uv
        run: curl -LsSf https://astral.sh/uv/install.sh | sh

      - name: Install dependencies
        run: uv sync

      - name: Sync comments from Regulations.gov
        env:
          REGULATIONS_API_KEY: ${{ secrets.REGULATIONS_API_KEY }}
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SECRET_KEY: ${{ secrets.SUPABASE_SERVICE_KEY }}
        run: |
          MODE="${{ github.event.inputs.mode || 'sync' }}"

          if [ "$MODE" = "backfill" ]; then
            uv run python -m src.jobs.sync \
              --backfill \
              --max-comments "${{ github.event.inputs.max_comments || '10000' }}"
          elif [ -n "${{ github.event.inputs.docket_id }}" ]; then
            uv run python -m src.jobs.sync \
              --docket-id "${{ github.event.inputs.docket_id }}" \
              --max-comments "${{ github.event.inputs.max_comments || '500' }}"
          else
            uv run python -m src.jobs.sync \
              --max-comments "${{ github.event.inputs.max_comments || '500' }}"
          fi

      - name: Summary
        if: always()
        run: |
          echo "## Sync Results" >> $GITHUB_STEP_SUMMARY
          echo "- **Time**: $(date -u)" >> $GITHUB_STEP_SUMMARY
          echo "- **Mode**: ${{ github.event.inputs.mode || 'sync' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Status**: ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
