name: Keep Scheduled Workflows Enabled

# GitHub disables scheduled workflows in a public repository after 60 days without
# repository activity. That silently stopped the daily sync and reports on 2026-05-14.
# This job re-enables them weekly (and right away whenever this file changes). It calls
# "enable" even on active workflows, which resets their inactivity timer, itself included.

on:
  schedule:
    - cron: '17 5 * * 1'  # Mondays 05:17 UTC
  push:
    paths:
      - '.github/workflows/keepalive.yml'
  workflow_dispatch:

permissions:
  actions: write

jobs:
  enable:
    runs-on: ubuntu-latest
    steps:
      - name: Re-enable scheduled workflows
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          for wf in sync.yml generate-reports.yml analyze.yml claude-analyze.yml keepalive.yml; do
            state=$(gh workflow view "$wf" --json state --jq .state 2>/dev/null || echo missing)
            echo "$wf: $state"
            if [ "$state" != "missing" ]; then
              gh workflow enable "$wf" && echo "  enabled"
            fi
          done
